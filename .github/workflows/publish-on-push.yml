name: Publish on push to main

on:
  push:
    branches: [main]
    # Avoid double-running on tag-only pushes (releases are cut by this workflow)
    tags-ignore: ['v*']
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type (used only on manual run)'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major, none]

concurrency:
  group: publish-apex-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Determine version bump
        id: bump
        run: |
          TYPE="${{ github.event.inputs.version_type }}"
          if [ "${{ github.event_name }}" = "push" ] || [ -z "$TYPE" ]; then
            TYPE=patch
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$TYPE" != "none" ]; then
            npm version "$TYPE" -m "chore(release): %s [skip ci]" --no-git-tag-version
            NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            git add package.json
            git commit -m "chore(release): bump to $NEW_VERSION [skip ci]"
            git push
          else
            NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish --access public

      - name: Build binary
        run: bun scripts/build-binary.mjs

      - name: Create GitHub release + attach binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          ASSET=$(ls release-tmp/ | head -1)
          if [ -z "$ASSET" ]; then
            echo "No binary produced; skipping release asset upload."
            exit 0
          fi
          # If release already exists (re-run), delete and recreate to keep asset in sync
          gh release delete "v$VERSION" -y || true
          git tag -d "v$VERSION" 2>/dev/null || true
          git push origin --delete "v$VERSION" 2>/dev/null || true
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            "release-tmp/$ASSET" \
            --title "v$VERSION" \
            --notes "Auto-published from main."
